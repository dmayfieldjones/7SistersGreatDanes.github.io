,&quot;(Bannasch et al., 2021)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41559-021-01524-x&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;E Locus Melanocortin 1 receptor (MC1R)&quot;],&quot;name2&quot;:[0,&quot;MC1R&quot;],&quot;summary&quot;:[0,&quot;This gene acts like a master switch for black pigment. When working normally, it allows dogs to produce black or brown pigment. When dogs have two copies of the non-working version, they can only produce red or yellow pigment regardless of other color genes. This explains why breeds like Irish Setters are always red - they have two copies of the non-working gene. MC1R works together with other color genes to create the diverse coat colors seen in dogs.&quot;],&quot;location&quot;:[0,&quot;chr5:64186690-64187643&quot;],&quot;citations&quot;:[0,&quot;(Honkanen et al., 2024)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/age.13398&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;K Locus Œ≤-defensin 103 (CBD103)&quot;],&quot;name2&quot;:[0,&quot;CBD103&quot;],&quot;summary&quot;:[0,&quot;This gene can override other color patterns and force black coat color when the dominant version is present. It produces a protein that binds to the MC1R receptor (E Locus) and changes how it works. The dominant \&quot;KB\&quot; version causes solid black, while other versions allow brindle patterns or let other color genes express themselves. In Great Danes, this gene is crucial for producing black and brindle coat colors.&quot;],&quot;location&quot;:[0,&quot;chr16:55467668-55469226&quot;],&quot;citations&quot;:[0,&quot;(Candille et al., 2007); (Nordlund et al., 2006)&quot;],&quot;doi1&quot;:[0,&quot;https://www.science.org/doi/10.1126/science.1147880&quot;],&quot;doi2&quot;:[0,&quot;https://www.google.com/books/edition/The_Pigmentary_System/4sn46U1uexoC?hl=en&amp;gbpv=1&amp;pg=PR5&amp;printsec=frontcover&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;D Locus Dilute/Blue melanophilin (MLPH)&quot;],&quot;name2&quot;:[0,&quot;MLPH&quot;],&quot;summary&quot;:[0,&quot;This gene affects how pigment granules are distributed in hair. When a dog has two copies of the defective version, it creates a \&quot;diluted\&quot; or washed-out appearance of their coat color - black becomes blue/grey, liver becomes isabella (lilac), and red becomes cream. In Great Danes, this gene is responsible for the blue color. Some dogs with dilute coats can develop a condition called color dilution alopecia, though the exact cause is still being studied.&quot;],&quot;location&quot;:[0,&quot;chr25:48403018-48448746&quot;],&quot;citations&quot;:[0,&quot;(Van Buren, 2020)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes11060639&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;M Locus Merle premelanosome protein (PMEL17/SILV)&quot;],&quot;name2&quot;:[0,&quot;PMEL17&quot;],&quot;summary&quot;:[0,&quot;This gene causes the merle pattern - random patches of diluted pigment mixed with normal-colored areas. It works by affecting how pigment is made and stored in cells. In Great Danes, merle is one of the recognized coat patterns. However, when a dog inherits two copies of the merle gene (double merle), it can cause serious vision and hearing problems. This is why responsible breeders never breed two merle dogs together.&quot;],&quot;location&quot;:[0,&quot;&quot;],&quot;citations&quot;:[0,&quot;(Clark et al., 2006); (Langevin et al., 2018)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1073/pnas.0506940103&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pone.0198536&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;H Locus Harlequin proteasome 20S subunit beta 7 (PSMB7)&quot;],&quot;name2&quot;:[0,&quot;PSMB7&quot;],&quot;summary&quot;:[0,&quot;This gene creates the unique Harlequin pattern seen only in Great Danes. It modifies the merle pattern by removing the diluted patches, leaving a white dog with solid black patches. The Harlequin gene must work with the merle gene to create this distinctive pattern. Like merle, breeding two Harlequin dogs together can cause health problems in puppies, so responsible breeders avoid this combination.&quot;],&quot;location&quot;:[0,&quot;chr9:58614281-58677679&quot;],&quot;citations&quot;:[0,&quot;(Clark et al., 2011) &quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1016/j.ygeno.2011.01.003&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;B Locus Brown/Chocolate/Liver tyrosinase related protein 1 (TYRP1)&quot;],&quot;name2&quot;:[0,&quot;TYRP1&quot;],&quot;summary&quot;:[0,&quot;This gene determines whether a dog&#39;s black pigment will be truly black or modified to brown/chocolate/liver. Great Danes typically don&#39;t carry the gene for brown, though it&#39;s theoretically possible. This gene affects not just coat color but also the color of the dog&#39;s nose, paw pads, and eyes. When a dog has two copies of the recessive version, black pigment is produced as brown instead, resulting in chocolate-colored dogs in breeds like Labrador Retrievers.&quot;],&quot;location&quot;:[0,&quot;chr11:33376152-33394014&quot;],&quot;citations&quot;:[0,&quot;(Schmutz et al., 2002)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1007/s00335-001-2147-2&quot;]}],[0,{&quot;type&quot;:[0,&quot;coatcolor&quot;],&quot;name&quot;:[0,&quot;S Locus Microphthalmia Associated Transcription Factor (MITF)&quot;],&quot;name2&quot;:[0,&quot;MITF&quot;],&quot;summary&quot;:[0,&quot;This gene controls where pigment-producing cells develop in the skin and hair. Variations create different white spotting patterns, from small white chest spots to mostly white dogs with colored patches. In extreme cases, it can affect eye color and hearing. In Great Danes, this gene may contribute to white markings like chest spots or white paws. White spots on dogs don&#39;t come from just one change in a single gene called MITF. Instead, the different patterns of white spots we see in dogs (like Extreme White, Piebald, and Irish Spotting) happen because of different combinations of gene changes. Research shows that two specific changes in the MITF gene (called LP and SINE insertions) work together to reduce the amount of MITF protein made while the puppy is developing before birth. When less MITF protein is made, the dog ends up with more white areas in its coat. Scientists still need to figure out if these white spot patterns are only caused by different combinations of MITF gene changes, or if other genes that affect how color cells develop and move around in the developing puppy are also involved.&quot;],&quot;location&quot;:[0,&quot;chr20:21991588-22022704&quot;],&quot;citations&quot;:[0,&quot;(Körberg et al., 2014)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1371/journal.pone.0104363&quot;]}],[0,{&quot;type&quot;:[0,&quot;pigmentation&quot;],&quot;name&quot;:[0,&quot;Major Facilitator Superfamily Domain Containing 12 gene (MFSD12)&quot;],&quot;name2&quot;:[0,&quot;MFSD12&quot;],&quot;summary&quot;:[0,&quot;This gene affects pigment production, particularly gray or \&quot;blue\&quot; coat colors. It transports molecules across cell membranes and influences what type of pigment is made in color-producing cells. In breeds like Kerry Blue Terriers, it causes puppies to be born dark and gradually lighten to gray as they mature. This gene helps scientists understand how coat colors develop and change.&quot;],&quot;location&quot;:[0,&quot;chr20:56252252-56260682&quot;],&quot;citations&quot;:[0,&quot;(Hédan et al., 2019)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes10050386&quot;]}],[0,{&quot;type&quot;:[0,&quot;hematological&quot;],&quot;name&quot;:[0,&quot;Serpin family F member 2 (SERPINF2)&quot;],&quot;name2&quot;:[0,&quot;SERPINF2&quot;],&quot;summary&quot;:[0,&quot;This gene helps control blood clotting by producing a protein that prevents clots from breaking down too quickly. Mutations can lead to bleeding disorders where dogs bleed longer than normal after injury. While uncommon, this condition has been found in multiple breeds and is important for breeders and veterinarians to monitor.&quot;],&quot;location&quot;:[0,&quot;chr9:45822215-45829811&quot;],&quot;citations&quot;:[0,&quot;(Court et al., 2023)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/jvim.16643&quot;]}],[0,{&quot;type&quot;:[0,&quot;hematological&quot;],&quot;name&quot;:[0,&quot;PKLR&quot;],&quot;name2&quot;:[0,&quot;PKLR&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme involved in generating energy from glucose. Mutations cause pyruvate kinase deficiency, a hereditary anemia where red blood cells break down prematurely due to energy deficiency. This condition affects several breeds, including Basenji, Beagle, and West Highland White Terriers. The clinical features closely resemble the human condition, making affected dogs valuable models for testing new treatments like gene therapy.&quot;],&quot;location&quot;:[0,&quot;chr7:42250696-42258642&quot;],&quot;citations&quot;:[0,&quot;(Luke et al., 2023)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1016/j.molmed.2023.02.005&quot;]}],[0,{&quot;type&quot;:[0,&quot;hematological&quot;],&quot;name&quot;:[0,&quot;VWF&quot;],&quot;name2&quot;:[0,&quot;VWF&quot;],&quot;summary&quot;:[0,&quot;This gene produces von Willebrand factor, a protein essential for normal blood clotting. Mutations cause von Willebrand disease, the most common inherited bleeding disorder in both dogs and humans. Affected dogs have prolonged bleeding after injuries or surgery. The condition is particularly common in Doberman Pinschers, Scottish Terriers, and German Shepherd Dogs. Research on canine VWF has been crucial for understanding platelet function and developing treatments for both species.&quot;],&quot;location&quot;:[0,&quot;chr27:7119622-7257688&quot;],&quot;citations&quot;:[0,&quot;(Bekkat-Berkani et al., 2025)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1002/vrc2.1066&quot;]}],[0,{&quot;type&quot;:[0,&quot;hematological&quot;],&quot;name&quot;:[0,&quot;ADAMTS13&quot;],&quot;name2&quot;:[0,&quot;ADAMTS13&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that regulates blood clotting by breaking down large clotting proteins. Deficiency causes thrombotic thrombocytopenic purpura, a rare but serious disorder where small clots form throughout the body&#39;s blood vessels. The naturally occurring canine model has significantly advanced our understanding of this condition in humans. Affected dogs develop anemia, low platelet counts, and organ dysfunction due to the formation of microthrombi in small blood vessels.&quot;],&quot;location&quot;:[0,&quot;chr9:49895000-49923185&quot;],&quot;citations&quot;:[0,&quot;(Barth, 2023); (Maruyama et al., 2012)&quot;],&quot;doi1&quot;:[0,&quot;http://hdl.handle.net/10919/116196&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1016/j.rvsc.2011.06.006&quot;]}],[0,{&quot;type&quot;:[0,&quot;hematological&quot;],&quot;name&quot;:[0,&quot;DMT1/SLC11A2&quot;],&quot;name2&quot;:[0,&quot;DMT1&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that transports iron into cells. In fact, it is the first identified mammalian transmembrane iron transporter. Mutations cause microcytic anemia, characterized by small red blood cells and iron deficiency despite adequate dietary iron. This condition shares similarities with human iron-deficiency anemia that doesn&#39;t respond to oral iron supplementation. Research on this gene in dogs has provided valuable insights into iron metabolism disorders and potential therapeutic approaches for both species.&quot;],&quot;location&quot;:[0,&quot;&quot;],&quot;citations&quot;:[0,&quot;(McCown and Specht, 2011); (Andrews, 1999)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.5326/JAAHA-MS-5553&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1016/s1357-2725(99)00065-5&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;Superoxide dismutase 1 (SOD1)&quot;],&quot;name2&quot;:[0,&quot;SOD1&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that protects cells from damage caused by harmful oxygen molecules. Mutations can cause degenerative myelopathy (DM), a progressive neurological disease similar to ALS in humans. Affected dogs develop weakness in their hind limbs that gradually worsens, eventually leading to paralysis. DM is most common in German Shepherds, Pembroke Welsh Corgis, and Boxers. Genetic testing can help breeders reduce the incidence of this disease.&quot;],&quot;location&quot;:[0,&quot;chr31:27118829-27126937&quot;],&quot;citations&quot;:[0,&quot;(Zheng et al., 2014); (Awano et al., 2009)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/jvim.12317&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1073/pnas.0812297106&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;ATP7A&quot;],&quot;name2&quot;:[0,&quot;ATP7A&quot;],&quot;summary&quot;:[0,&quot;This gene helps control copper levels in the body by moving copper in and out of cells. Mutations can lead to copper accumulation in tissues, causing toxicity. In humans, mutations cause Menkes disease, a severe disorder from copper deficiency. The gene works similarly in dogs, though the symptoms may differ. Research on this gene in dogs has improved our understanding of copper-related disorders in both species.&quot;],&quot;location&quot;:[0,&quot;chrX:60346304-60499464&quot;],&quot;citations&quot;:[0,&quot;(Pindar and Ramirez, 2019); (Wu et al., 2019)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org//10.1007/s00439-019-02010-y&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1111/jvim.15536&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;NDUFS4&quot;],&quot;name2&quot;:[0,&quot;NDUFS4&quot;],&quot;summary&quot;:[0,&quot;This gene helps produce energy in the cell&#39;s mitochondria. Mutations cause a severe neurological disorder in dogs that resembles Leigh syndrome in humans. Affected dogs show similar symptoms to human patients, including seizures, coordination problems, and brain abnormalities. Studying this gene in dogs has provided valuable insights for potential therapies for both species.&quot;],&quot;location&quot;:[0,&quot;chr4:62529496-62643162&quot;],&quot;citations&quot;:[0,&quot;(Drögemüller et al., 2020); (Breuer et al., 2013)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes11101215&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1002/iub.1127&quot;]}],[0,{&quot;type&quot;:[0,&quot;hypersocial&quot;],&quot;name&quot;:[0,&quot;SEZ6L&quot;],&quot;name2&quot;:[0,&quot;SEZ6L&quot;],&quot;summary&quot;:[0,&quot;This gene affects brain development and neuron activity. Associated with dog behavior such as spending time near, and in physical contact with, humans, this gene is implicated in human autism. In dogs, variations are linked to idiopathic epilepsy - recurrent seizures without an identifiable structural cause. Similar connections between this gene and epilepsy exist in humans, suggesting it plays a similar role across species. Research on this gene in dogs has improved our understanding of seizure disorders.&quot;],&quot;location&quot;:[0,&quot;chr26:20295389-20485072&quot;],&quot;citations&quot;:[0,&quot;(Perrson et al., 2016)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/srep33439&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;ADAM23&quot;],&quot;name2&quot;:[0,&quot;ADAM23&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that helps neurons connect and communicate with each other. Variations are strongly linked to epilepsy in several dog breeds, including Belgian Shepherds. The gene influences how easily neurons can trigger electrical signals, with certain variants making seizures more likely. Studying this gene in dogs has identified potential targets for new epilepsy treatments.&quot;],&quot;location&quot;:[0,&quot;chr37:14835710-15023250&quot;],&quot;citations&quot;:[0,&quot;(Kinsey et al., 2024); (Koskinen et al., 2014)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes15111474&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1186/s12864-015-1651-9&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;NF1&quot;],&quot;name2&quot;:[0,&quot;NF1&quot;],&quot;summary&quot;:[0,&quot;This gene produces neurofibromin, a protein that regulates cell growth in the nervous system. Mutations can cause a condition similar to neurofibromatosis type 1 in humans, leading to benign tumors along nerves and other neurological symptoms. While rare in dogs, the similarities to the human condition make affected dogs valuable for research.&quot;],&quot;location&quot;:[0,&quot;chr9:41442649-41716759&quot;],&quot;citations&quot;:[0,&quot;(Osum et al., 2021)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/ijms22041954&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;APP&quot;],&quot;name2&quot;:[0,&quot;APP&quot;],&quot;summary&quot;:[0,&quot;This gene produces amyloid precursor protein, which breaks down into fragments including beta-amyloid, a major component of the plaques found in Alzheimer&#39;s disease. In older dogs, similar amyloid deposits develop naturally, leading to cognitive dysfunction that resembles human dementia. This makes aging dogs an important natural model for studying age-related cognitive decline.&quot;],&quot;location&quot;:[0,&quot;chr31:21899466-22164885&quot;],&quot;citations&quot;:[0,&quot;(de Sousa et al., 2023); (Lee et al., 2014)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s42003-023-05034-3&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.3892/ijmm.2014.1636&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;ATP1B2&quot;],&quot;name2&quot;:[0,&quot;ATP1B2&quot;],&quot;summary&quot;:[0,&quot;This gene produces part of a pump that maintains proper ion balance in neurons. Mutations are associated with cerebellar ataxia in dogs, a condition causing poor coordination and balance due to abnormal cerebellar function. The gene plays a key role in how cerebellar neurons work to control precise movements.&quot;],&quot;location&quot;:[0,&quot;chr5:32756419-32762956&quot;],&quot;citations&quot;:[0,&quot;(Mauri et al., 2017)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1534/g3.117.043018&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;CSTB&quot;],&quot;name2&quot;:[0,&quot;CSTB&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that prevents excessive protein breakdown in neurons. Mutations cause progressive myoclonic epilepsy, characterized by muscle jerks, seizures, and progressive neurological deterioration. This condition closely resembles Unverricht-Lundborg disease in humans, which is caused by mutations in the same gene. Research in dogs has provided insights into this rare form of epilepsy.&quot;],&quot;location&quot;:[0,&quot;chr31:37607453-37610501&quot;],&quot;citations&quot;:[0,&quot;(Gumusgoz et al., 2024)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41434-023-00433-x&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;NAGLU&quot;],&quot;name2&quot;:[0,&quot;NAGLU&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down complex sugars in the body. Deficiency causes mucopolysaccharidosis IIIB, a storage disorder where these sugars accumulate and cause progressive brain damage. Affected dogs develop behavioral changes, cognitive decline, and movement problems, similar to human patients. Dog models have been crucial for testing new treatments like enzyme replacement and gene therapy.&quot;],&quot;location&quot;:[0,&quot;chr9:20281366-20288130&quot;],&quot;citations&quot;:[0,&quot;(Raj et al., 2020)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41598-020-60121-3&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;ARSA&quot;],&quot;name2&quot;:[0,&quot;ARSA&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down certain fats important for myelin, the insulation around nerve fibers. Mutations cause metachromatic leukodystrophy, a devastating disorder where loss of myelin leads to progressive neurological deterioration. Dogs with this condition develop tremors, coordination problems, and eventually paralysis. Canine studies have been valuable for testing potential treatments, including gene therapy.&quot;],&quot;location&quot;:[0,&quot;chr10:17597813-17600232&quot;],&quot;citations&quot;:[0,&quot;(Velde et al., 2022); (Abitbol et al., 2010)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1007/s00439-022-02441-0&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1073/pnas.091420610&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;TPP1&quot;],&quot;name2&quot;:[0,&quot;TPP1&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down proteins in lysosomes, the cell&#39;s recycling centers. Mutations cause neuronal ceroid lipofuscinosis, a group of disorders where material accumulates in neurons, causing progressive neurological deterioration. Affected dogs develop seizures, coordination problems, and vision loss. Research in dogs led directly to an FDA-approved enzyme replacement therapy now used to treat children with this condition.&quot;],&quot;location&quot;:[0,&quot;chr21:30429691-30434901&quot;],&quot;citations&quot;:[0,&quot;(Kick, 2021); (Awano et al., 2006)&quot;],&quot;doi1&quot;:[0,&quot;https://www.proquest.com/dissertations-theses/disease-characterization-pre-clinical-testing/docview/2622950818/se-2&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1016/j.ymgme.2006.02.016&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;PLA2G6&quot;],&quot;name2&quot;:[0,&quot;PLA2G6&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme important for maintaining cell membrane health. Mutations cause a neurodegenerative disorder characterized by brain iron accumulation, coordination problems, and cognitive decline. The condition is similar to human infantile neuroaxonal dystrophy and certain forms of neurodegeneration with brain iron accumulation. Research in dogs has improved our understanding of how problems with phospholipid metabolism can damage the nervous system.&quot;],&quot;location&quot;:[0,&quot;chr10:27499582-27559773&quot;],&quot;citations&quot;:[0,&quot;(Raj et al., 2020); (Tsuboi et al., 2017)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1186/s40575-020-00098-4&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pone.0169002&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;CLN8&quot;],&quot;name2&quot;:[0,&quot;CLN8&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein involved in lipid transport and metabolism. Mutations cause a form of neuronal ceroid lipofuscinosis, a neurodegenerative disorder where fluorescent material accumulates in neurons. Affected dogs develop cognitive decline, seizures, coordination problems, and vision loss, similar to human patients with mutations in the same gene. Dog models have been used to test potential treatments, including gene therapy.&quot;],&quot;location&quot;:[0,&quot;chr37:30752705-30770116&quot;],&quot;citations&quot;:[0,&quot;(Hirz et al., 2017)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1016/j.ymgme.2016.12.007&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;COLQ&quot;],&quot;name2&quot;:[0,&quot;COLQ&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein essential for the function of neuromuscular junctions, where nerves connect to muscles. Mutations cause congenital myasthenic syndrome in Labrador Retrievers and humans, characterized by muscle weakness and fatigue that worsens with exercise. Affected puppies show exercise intolerance and collapse after activity. The canine model has been valuable for developing treatments for this rare condition and understanding how nerves communicate with muscles.&quot;],&quot;location&quot;:[0,&quot;&quot;],&quot;citations&quot;:[0,&quot;(Tsai et al., 2020)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/jvim.15667&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;NEU1&quot;],&quot;name2&quot;:[0,&quot;NEU1&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down specific sugar-containing compounds. Deficiency causes sialidosis, a lysosomal storage disorder affecting both dogs and humans. The condition has been documented in Schipperkes, where affected dogs develop progressive neurological issues, skeletal abnormalities, and vision problems. The similarities to human sialidosis make this canine model valuable for understanding the disease mechanisms and testing potential therapies.&quot;],&quot;location&quot;:[0,&quot;chr12:1455970-1460945&quot;],&quot;citations&quot;:[0,&quot;(Peng et al., 2025); (Makielski et al., 2021)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41374-021-00655-w&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.3390/genes16020151&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;GBA&quot;],&quot;name2&quot;:[0,&quot;GBA&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down certain fats in the body. Mutations cause Gaucher disease in humans and similar storage disorders in dogs. The enzyme deficiency leads to fat accumulation in various tissues, particularly in immune cells. In humans, GBA mutations are increasingly recognized as a significant risk factor for Parkinson&#39;s disease. The canine model provides insights into how these mutations affect brain function and could help develop treatments for both conditions.&quot;],&quot;location&quot;:[0,&quot;chr7:42304204-42308788&quot;],&quot;citations&quot;:[0,&quot;(Cabasso et al., 2023); (Hartely and Blakemore, 1973)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/ijms242216035&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1177/030098587301000302&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;Progressive rod-cone degeneration (PRCD)&quot;],&quot;name2&quot;:[0,&quot;PRCD&quot;],&quot;summary&quot;:[0,&quot;This gene is essential for maintaining healthy photoreceptor cells in the retina. Mutations cause progressive retinal atrophy (PRA), a common inherited eye disorder that leads to blindness. The condition first affects night vision as rod cells die, then progresses to affect day vision as cone cells deteriorate. PRA affects many breeds including Labrador Retrievers, Poodles, and Cocker Spaniels. Genetic testing is valuable for breeders to prevent this condition.&quot;],&quot;location&quot;:[0,&quot;chr9:5087716-5091027&quot;],&quot;citations&quot;:[0,&quot;(Clark et al., 2023) &quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes14112093&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;RPGRIP1&quot;],&quot;name2&quot;:[0,&quot;RPGRIP1&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein found in the connecting cilium of photoreceptors, the specialized light-sensing cells in the retina. Mutations cause X-linked progressive retinal atrophy in dogs, a degenerative eye disease leading to blindness. Similar to human X-linked retinitis pigmentosa, affected males develop night blindness that progresses to complete blindness. Successful gene therapy in dogs has directly informed human clinical trials for this condition.&quot;],&quot;location&quot;:[0,&quot;chr15:18442510-18513618&quot;],&quot;citations&quot;:[0,&quot;(Donner and Mellersh, 2023); (Ripolles-Garcia et al., 2023)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/age.13443&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1093/hmg/ddad046&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;BEST1&quot;],&quot;name2&quot;:[0,&quot;BEST1&quot;],&quot;summary&quot;:[0,&quot;This gene produces an ion channel in the retinal pigment epithelium, the layer of cells supporting photoreceptors. Mutations cause canine multifocal retinopathy, characterized by fluid-filled detachments in the retina. Affected dogs develop characteristic retinal lesions that can affect vision to varying degrees. Research on this gene has improved our understanding of fluid balance in the retina and the role of the retinal pigment epithelium in eye health.&quot;],&quot;location&quot;:[0,&quot;chr18:55071126-55082395&quot;],&quot;citations&quot;:[0,&quot;(Aguirre and Beltran, 2025)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41433-024-03578-0&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;RHO&quot;],&quot;name2&quot;:[0,&quot;RHO&quot;],&quot;summary&quot;:[0,&quot;This gene produces rhodopsin, the light-sensitive pigment in rod photoreceptors that allows vision in dim light. Mutations cause a form of progressive retinal atrophy in dogs, particularly in English Mastiffs. Similar to human retinitis pigmentosa, affected dogs first develop night blindness that progresses to complete blindness as both rod and cone photoreceptors degenerate. Research on this gene has enhanced our understanding of retinal degeneration mechanisms.&quot;],&quot;location&quot;:[0,&quot;chr20:5706443-5711705&quot;],&quot;citations&quot;:[0,&quot;(Cideciyan et al., 2018); (Kijas et al., 2002)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1073/pnas.1805055115&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1073/pnas.08271449&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;CNGB3&quot;],&quot;name2&quot;:[0,&quot;CNGB3&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of the ion channel in cone photoreceptors that is essential for daytime and color vision. Mutations cause achromatopsia, a congenital condition characterized by day blindness, poor color vision, and light sensitivity. Affected dogs, particularly Alaskan Malamutes and German Shorthaired Pointers, have normal vision in dim light but severely impaired vision in daylight. Successful gene therapy in dogs has led directly to human clinical trials.&quot;],&quot;location&quot;:[0,&quot;chr29:33393790-33536962&quot;],&quot;citations&quot;:[0,&quot;(Tanaka et al., 2013); (Sidjanin et al., 2002)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1371/journal.pone.0138943&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1093/hmg/11.16.1823&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;ABCA4&quot;],&quot;name2&quot;:[0,&quot;ABCA4&quot;],&quot;summary&quot;:[0,&quot;This gene primarily affects the retina, where it helps clear potentially toxic compounds that form during vision. While mainly associated with retinal diseases, it plays a role in lipid transport throughout the body. In dogs, mutations cause retinal diseases and vision loss. Research on this gene has focused mainly on its role in retinal health, providing insights for both veterinary eye conditions and human macular disorders.&quot;],&quot;location&quot;:[0,&quot;chr6:55552093-55679433&quot;],&quot;citations&quot;:[0,&quot;(Ekesten et al., 2022); (Mäkeläinen et al., 2019)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1167/tvst.11.2.36&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pgen.1007873&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;FAM161A&quot;],&quot;name2&quot;:[0,&quot;FAM161A&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein important for the structure and function of photoreceptor cells. Mutations cause a form of retinitis pigmentosa in both dogs and humans, leading to progressive vision loss. The protein is located in the connecting cilium of photoreceptors, a structure critical for cell maintenance. Studies in dogs with FAM161A mutations have provided insights into the disease mechanisms and are being used to develop and test therapeutic approaches that could benefit human patients with similar mutations.&quot;],&quot;location&quot;:[0,&quot;chr10:63066672-63131867&quot;],&quot;citations&quot;:[0,&quot;(Stanbury et al., 2024); (Downs and Mellersh, 2014) &quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes15070952&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pone.0093990&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;Bridging integrator 1 (BIN1)&quot;],&quot;name2&quot;:[0,&quot;BIN1&quot;],&quot;summary&quot;:[0,&quot;This gene is crucial for normal muscle function. Mutations can cause centronuclear myopathy (CNM) in Great Danes (the best dog breed), a severe muscle disorder that causes weakness and muscle wasting. Affected dogs have difficulty standing, walking, and even swallowing. The condition is inherited recessively, meaning both parents must pass on the defective gene for puppies to be affected. Genetic testing is important for Great Dane breeders to prevent this condition.&quot;],&quot;location&quot;:[0,&quot;chr19:24831980-24884833&quot;],&quot;citations&quot;:[0,&quot;(Lionello et al., 2019); (Böhm et al., 2013)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1126/scitranslmed.aav1866&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pgen.1003430&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;COL9A3&quot;],&quot;name2&quot;:[0,&quot;COL9A3&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of type IX collagen, important for cartilage structure and function. In Samoyed and Labrador Retriever breeds, a mutation causes oculoskeletal dysplasia, combining skeletal abnormalities (dwarfism) with eye defects. The mutation disrupts both skeletal development and eye structure. Similar mutations in humans cause related skeletal disorders, making this gene important for comparative research.&quot;],&quot;location&quot;:[0,&quot;chr24:47503126-47518786&quot;],&quot;citations&quot;:[0,&quot;(Stavinahova et al., 2019); (Goldstein et al., 2010)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1371/journal.pone.0220761&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1007/s00335-010-9276-4&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;DMD&quot;],&quot;name2&quot;:[0,&quot;DMD&quot;],&quot;summary&quot;:[0,&quot;This gene produces dystrophin, a large protein that connects muscle fiber structure to the surrounding matrix, providing stability during contraction. Mutations cause muscular dystrophy, a progressive muscle-wasting disease. Golden Retriever muscular dystrophy has been particularly well-studied and closely resembles Duchenne muscular dystrophy in humans. Research using dog models has been crucial for developing treatments now being tested in human patients.&quot;],&quot;location&quot;:[0,&quot;chrX:26455978-28540050&quot;],&quot;citations&quot;:[0,&quot;(Shelton et al., 2023); (Sharp et al., 1992)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes14081557&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1016/0888-7543(92)90210-J&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;SGCA&quot;],&quot;name2&quot;:[0,&quot;SGCA&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of the sarcoglycan complex, which helps connect muscle fibers to their surrounding environment. Mutations inititally shown in Miniature Dachshunds cause limb-girdle muscular dystrophy, affecting primarily the shoulders and hips. Similar to the human form of the disease, affected dogs develop progressive muscle weakness and elevated muscle enzymes in the blood. Research on this gene has contributed to our understanding of muscular dystrophies.&quot;],&quot;location&quot;:[0,&quot;chr9:26115697-26129096&quot;],&quot;citations&quot;:[0,&quot;(Mickelson et al., 2020)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1186/s13395-020-00257-y&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;COL1A1/COL1A2&quot;],&quot;name2&quot;:[0,&quot;COL1A1&quot;],&quot;summary&quot;:[0,&quot;These genes produce components of type I collagen, the most abundant protein in bone and a major component of tendons, ligaments, and skin. Mutations cause osteogenesis imperfecta, a condition characterized by bone fragility and frequent fractures. Affected dogs may also have loose joints and blue-tinted eye whites due to thin collagen-deficient tissues. Research on these genes has improved our understanding of bone development and fragility disorders.&quot;],&quot;location&quot;:[0,&quot;chr9:26134702-26150789&quot;],&quot;citations&quot;:[0,&quot;(Campbell et al., 2001); (Campbell et al., 2000)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1359/jbmr.2001.16.6.1147&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1006/abbi.2000.2099&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;CLCN1&quot;],&quot;name2&quot;:[0,&quot;CLCN1&quot;],&quot;summary&quot;:[0,&quot;This gene produces a chloride channel in skeletal muscle that helps control muscle excitability. Mutations cause myotonia congenita, a condition where muscles are slow to relax after contraction, resulting in stiffness. Affected dogs show the characteristic \&quot;bunny hopping\&quot; gait, muscle enlargement, and stiffness that temporarily worsens with exercise but improves with continued activity. Research on this gene has improved our understanding of muscle electrical properties.&quot;],&quot;location&quot;:[0,&quot;chr16:6071349-6101933&quot;],&quot;citations&quot;:[0,&quot;(Shelton et al., 2024); (Chimenes et al., 2023)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/ani14050722&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1177/10406387231176736&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;SGCD&quot;],&quot;name2&quot;:[0,&quot;SGCD&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of the sarcoglycan complex, which helps connect muscle fibers to their surrounding environment. Mutations initially shown in Boston Terriers cause limb-girdle muscular dystrophy, affecting primarily the shoulders and hips. Similar to the human form of the disease, affected dogs develop progressive muscle weakness and elevated muscle enzymes in the blood. Research on this gene has contributed to our understanding of muscular dystrophies.&quot;],&quot;location&quot;:[0,&quot;chr4:54146275-55057219&quot;],&quot;citations&quot;:[0,&quot;(Cox et al., 2017)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1186/s13395-017-0131-0&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;COL6A3&quot;],&quot;name2&quot;:[0,&quot;COL6A3&quot;],&quot;summary&quot;:[0,&quot;This gene produces the alpha-3 chain of type VI collagen, an important protein found in the extracellular matrix surrounding muscle cells and in connective tissues. Mutations in COL6A3 can cause Ullrich congenital muscular dystrophy and Bethlem myopathy in both dogs and humans. These conditions are characterized by muscle weakness, joint laxity, and contractures. In affected dogs, symptoms include abnormal gait, muscle weakness that worsens with exercise, and distinctive postures due to joint stiffness. Research on this gene, like that in Labrador Retriever and American Staffordshire Terrier, has provided insights into the role of the extracellular matrix in muscle function and maintenance, with implications for both veterinary medicine and human muscular dystrophy treatments.&quot;],&quot;location&quot;:[0,&quot;chr25:48253810-48333969&quot;],&quot;citations&quot;:[0,&quot;(Buldoc et al., 2020)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1016/j.nmd.2020.03.005&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;LAMA2&quot;],&quot;name2&quot;:[0,&quot;LAMA2&quot;],&quot;summary&quot;:[0,&quot;This gene produces laminin alpha-2, a key component of the basement membrane surrounding muscle fibers and Schwann cells in nerves. Mutations in LAMA2 cause congenital muscular dystrophy type 1A in both dogs and humans, characterized by early-onset muscle weakness, hypotonia, and potential brain abnormalities. In affected puppies, symptoms include weakness from birth, difficulty nursing, abnormal posture, and contractures of joints. The disease progresses rapidly, often leading to respiratory difficulties. Research on canine LAMA2, like in Italian Greyhound and American Staffordshire Terrier, has provided valuable insights into disease mechanisms and potential therapeutic approaches. The gene illustrates the critical role of basement membrane proteins in maintaining muscle integrity and function.&quot;],&quot;location&quot;:[0,&quot;chr1:68070825-68654877&quot;],&quot;citations&quot;:[0,&quot;(Shelton et al., 2021); (Christen et al., 2021)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/jvim.16330&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.3390/genes12111823&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;LARGE1&quot;],&quot;name2&quot;:[0,&quot;LARGE1&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that adds sugar molecules to alpha-dystroglycan, a protein crucial for connecting muscle cells to their surrounding environment. Mutations in LARGE1 cause congenital muscular dystrophy with hypoglycosylation of alpha-dystroglycan (also known as dystroglycanopathy) in both dogs and humans. The condition has been documented in Labrador Retrievers. Affected puppies develop progressive muscle weakness, joint contractures, and neurological issues including seizures and cognitive impairment. The disease mechanism involves defective glycosylation, which disrupts the structural integrity of the muscle-extracellular matrix connection. Research on canine LARGE1 mutations has provided significant insights into the role of glycosylation in muscle function and has contributed to the development of potential therapeutic approaches for these devastating conditions.&quot;],&quot;location&quot;:[0,&quot;chr10:30887220-31413494&quot;],&quot;citations&quot;:[0,&quot;(Shelton et al., 2021)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1111/jvim.16330&quot;]}],[0,{&quot;type&quot;:[0,&quot;musculoskeletal&quot;],&quot;name&quot;:[0,&quot;FGF4&quot;],&quot;name2&quot;:[0,&quot;FGF4&quot;],&quot;summary&quot;:[0,&quot;This gene produces a growth factor involved in many aspects of development. In dogs, FGF4 can be copied and inserted into different chromosomes, causing various breed-specific traits and health issues. Insertions on chromosome 12 cause the short legs seen in Dachshunds and Corgis, while insertions on chromosome 18 increase risk of intervertebral disc disease and &#39;cherry eye&#39; (a protruding third eyelid gland). In Rhodesian and Thai Ridgebacks, a 133-kb duplication involving three FGF genes causes the distinctive hair ridge on their backs - a dominant trait that unfortunately also predisposes them to dermoid sinus, a congenital skin condition. This gene demonstrates how the same family of growth factors can create breed-defining characteristics while sometimes causing health complications.&quot;],&quot;location&quot;:[0,&quot;chr18:48869443-48873311&quot;],&quot;citations&quot;:[0,&quot;(Freyer et al., 2024); (Bannasch et al., 2022)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/genes15020198&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.3390/genes13020325&quot;]}],[0,{&quot;type&quot;:[0,&quot;ophthalmological&quot;],&quot;name&quot;:[0,&quot;NOG&quot;],&quot;name2&quot;:[0,&quot;NOG&quot;],&quot;summary&quot;:[0,&quot;This gene produces noggin, a protein essential for corneal health. In Boxer dogs, a mutation in NOG causes them to be prone to &#39;boxer ulcers&#39; - stubborn corneal ulcers that don&#39;t heal properly and cause pain, tearing, and squinting. The discovery of this genetic link explains why Boxers frequently develop these eye problems and offers potential for genetic testing to identify at-risk dogs. Similar corneal conditions exist in humans, making this finding relevant for both veterinary and human medicine.&quot;],&quot;location&quot;:[0,&quot;chr9:31415982-31416833&quot;],&quot;citations&quot;:[0,&quot;(Meurs et al., 2021); (Mikkola et al., 2019)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1186/s12917-021-02955-1&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pgen.1008197&quot;]}],[0,{&quot;type&quot;:[0,&quot;developmental&quot;],&quot;name&quot;:[0,&quot;DVL2&quot;],&quot;name2&quot;:[0,&quot;DVL2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein involved in a signaling pathway that controls embryonic development, particularly affecting formation of the spine and facial features. In dogs, mutations in DVL2 have been linked to screw tail (ingrown tail) and associated features in breeds like Bulldogs, French Bulldogs, and Boston Terriers. These dogs often have distinctive flat faces, spinal abnormalities, and corkscrew-shaped tails. The same gene affects similar developmental processes in humans, with mutations associated with Robinow syndrome, which causes facial abnormalities and skeletal defects. This gene demonstrates how small genetic changes can create breed-defining traits that unfortunately may also cause health issues.&quot;],&quot;location&quot;:[0,&quot;chr5:32401214-32408791&quot;],&quot;citations&quot;:[0,&quot;(Niskanen et al., 2021); (Mansour et al., 2018)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1007/s00439-021-02261-8&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1371/journal.pgen.1007850&quot;]}],[0,{&quot;type&quot;:[0,&quot;neurological&quot;],&quot;name&quot;:[0,&quot;NAPEPLD&quot;],&quot;name2&quot;:[0,&quot;NAPEPLD&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme with multiple important functions in the brain. It helps produce signaling molecules that affect reward behaviors, feeding, and energy balance. In dogs, mutations cause a serious neurological disease called LEMP. Affected young dogs develop trouble walking, poor coordination, and weakness. Beyond neurological effects, this gene influences how the brain processes food rewards and regulates body weight. Research shows it may also play a role in protecting against obesity. &quot;],&quot;location&quot;:[0,&quot;chr18:17219297-17269945&quot;],&quot;citations&quot;:[0,&quot;(Minor et al., 2018)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41598-018-23938-7&quot;]}],[0,{&quot;type&quot;:[0,&quot;dermatological&quot;],&quot;name&quot;:[0,&quot;FOXI3&quot;],&quot;name2&quot;:[0,&quot;FOXI3&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein involved in the development of structures derived from the embryonic ectoderm, including hair follicles and teeth. Mutations cause the hairless phenotype in breeds like the Chinese Crested and Xoloitzcuintli (Mexican Hairless). Dogs with one copy have the characteristic hairless appearance, while those with two copies typically don&#39;t survive embryonic development. Research on this gene has provided insights into hair follicle and tooth development. This is one example of a trait deemed desirable in which there is a confered direct risk of health issues. This gene will likely continue to draw ethical attention as breeders balance aesthetics and tradition with animal health and welfare.&quot;],&quot;location&quot;:[0,&quot;chr17:38315971-38319969&quot;],&quot;citations&quot;:[0,&quot;(Kipczik et al., 2016); (Drögemüller et al., 2008)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1038/s41598-017-05764-5&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1126/science.1162525&quot;]}],[0,{&quot;type&quot;:[0,&quot;dermatological&quot;],&quot;name&quot;:[0,&quot;FGF5&quot;],&quot;name2&quot;:[0,&quot;FGF5&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that regulates hair growth cycles and is associated with nose size. Together, these traits likely play a role in thermoregulation to different degrees in different breeds. Mutations cause the long-haired phenotype seen in many breeds, such as Golden Retrievers and Newfoundlands. The gene normally signals hair follicles to end their growth phase, and when mutated, results in prolonged growth and longer hair.   Mutations of FGF5 in humans can result in trichomegaly (long eyelashes). This discovery has helped explain the genetic basis of coat length variation across dog breeds.&quot;],&quot;location&quot;:[0,&quot;chr32:35474935-35494799&quot;],&quot;citations&quot;:[0,&quot;(Russel et al., 2025); (Dierks et al., 2013)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1002/jez.2899&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1111/age.12010&quot;]}],[0,{&quot;type&quot;:[0,&quot;dermatological&quot;],&quot;name&quot;:[0,&quot;RSPO2&quot;],&quot;name2&quot;:[0,&quot;RSPO2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that enhances signaling pathways involved in both hair follicle and limb development. In many wire-haired breeds like Terriers and Schnauzers, a mutation near this gene causes the distinctive &#39;furnishings&#39; trait - the beard and eyebrow hair that gives these dogs their characteristic look. More recently, a different mutation in RSPO2 has been identified as the cause of bilateral amelia in Chihuahuas - a serious birth defect where puppies are born without front legs. This condition is inherited in an autosomal recessive pattern, meaning both parents must carry the mutation for puppies to be affected. The same gene has been linked to limb abnormalities in humans and cattle. RSPO2 demonstrates how the same gene can influence both cosmetic traits (coat type) and critical developmental processes (limb formation) in dogs.&quot;],&quot;location&quot;:[0,&quot;chr13:8823008-8971462&quot;],&quot;citations&quot;:[0,&quot;(Chevallier et al., 2025); (Cadieu et al., 2009)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.1007/s00335-025-10123-1&quot;],&quot;doi2&quot;:[0,&quot;https://doi.org/10.1126/science.1177808&quot;]}],[0,{&quot;type&quot;:[0,&quot;dermatological&quot;],&quot;name&quot;:[0,&quot;PNPLA1&quot;],&quot;name2&quot;:[0,&quot;PNPLA1&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme involved in skin lipid metabolism, critical for maintaining the skin&#39;s water barrier. Mutations cause ichthyosis in Golden Retrievers and humans, a condition characterized by dry, thickened, and scaling skin. Affected puppies are born with abnormal skin that can appear dirty or greasy. The condition is not curable but can be managed with special shampoos and moisturizers. Research on this gene in dogs has revealed important aspects of skin barrier function and lipid metabolism that apply to human skin disorders as well.&quot;],&quot;location&quot;:[0,&quot;chr12:5559044-5605194&quot;]}],[0,{&quot;type&quot;:[0,&quot;dermatological&quot;],&quot;name&quot;:[0,&quot;IKBKG&quot;],&quot;name2&quot;:[0,&quot;IKBKG&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein involved in immune function and development of ectodermal tissues (skin, hair, teeth). Mutations cause ectodermal dysplasia with immunodeficiency in dogs and humans. Affected dogs have abnormal hair coats, dental abnormalities, and recurrent infections due to immune system defects. The condition affects multiple body systems derived from the embryonic ectoderm. The canine model has been valuable for understanding the relationship between skin development and immune function across species.&quot;],&quot;location&quot;:[0,&quot;chrX:123419351-123440993&quot;]}],[0,{&quot;type&quot;:[0,&quot;auditory&quot;],&quot;name&quot;:[0,&quot;MYO7A&quot;],&quot;name2&quot;:[0,&quot;MYO7A&quot;],&quot;summary&quot;:[0,&quot;This gene produces a motor protein found in the inner ear hair cells and retinal photoreceptors. Mutations cause deafness, often associated with balance problems. Similar to Usher syndrome type 1B in humans, affected dogs develop hearing loss due to abnormalities in inner ear hair cell development and function. Research on this gene has improved our understanding of the genetic causes of deafness.&quot;],&quot;location&quot;:[0,&quot;chr21:21654692-21739052&quot;]}],[0,{&quot;type&quot;:[0,&quot;auditory&quot;],&quot;name&quot;:[0,&quot;TMC1&quot;],&quot;name2&quot;:[0,&quot;TMC1&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of the mechanotransduction channel in inner ear hair cells, which converts sound waves into electrical signals. Mutations cause hereditary deafness in dogs, particularly in certain terrier breeds. Affected dogs develop severe to profound hearing loss, often apparent from a young age. Research on this gene has enhanced our understanding of hearing mechanisms and the causes of genetic deafness.&quot;],&quot;location&quot;:[0,&quot;chr1:85722917-85817907&quot;]}],[0,{&quot;type&quot;:[0,&quot;auditory&quot;],&quot;name&quot;:[0,&quot;PCDH15&quot;],&quot;name2&quot;:[0,&quot;PCDH15&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein important for inner ear hair cell function and retinal photoreceptor maintenance. Mutations can cause combined hearing and vision impairments in dogs. Similar to Usher syndrome in humans, affected dogs may develop both deafness and retinal degeneration. Research on this gene has provided insights into the molecular basis of combined sensory disorders.&quot;],&quot;location&quot;:[0,&quot;chr26:34074758-34812730&quot;]}],[0,{&quot;type&quot;:[0,&quot;auditory&quot;],&quot;name&quot;:[0,&quot;USH2A&quot;],&quot;name2&quot;:[0,&quot;USH2A&quot;],&quot;summary&quot;:[0,&quot;This gene produces usherin, a protein found in both the inner ear and retina. Mutations can cause combined hearing and vision impairments in dogs. Similar to Usher syndrome type 2A in humans, affected dogs may develop moderate to severe hearing loss and progressive retinal degeneration. Research on this gene has enhanced our understanding of the common molecular pathways in ear and eye development.&quot;],&quot;location&quot;:[0,&quot;chr38:11739438-12442329&quot;]}],[0,{&quot;type&quot;:[0,&quot;hepatic&quot;],&quot;name&quot;:[0,&quot;ATP7B&quot;],&quot;name2&quot;:[0,&quot;ATP7B&quot;],&quot;summary&quot;:[0,&quot;This gene helps the liver remove excess copper into bile. In Bedlington Terriers, mutations cause copper toxicosis, where copper builds up in the liver leading to inflammation and liver damage. This condition is remarkably similar to Wilson&#39;s disease in humans, which is caused by mutations in the same gene. Bedlington Terriers provided one of the first animal models for studying Wilson&#39;s disease.&quot;],&quot;location&quot;:[0,&quot;chr22:163429-197022&quot;]}],[0,{&quot;type&quot;:[0,&quot;renal&quot;],&quot;name&quot;:[0,&quot;CLCN5&quot;],&quot;name2&quot;:[0,&quot;CLCN5&quot;],&quot;summary&quot;:[0,&quot;This gene produces a chloride channel in kidney cells that helps reabsorb proteins from urine. Mutations cause Dent disease in humans and similar renal tubular disorders in dogs. The condition leads to protein loss in urine, kidney stones, and progressive kidney damage. The similarities in kidney function and disease progression between dogs and humans with CLCN5 mutations make this gene important for understanding kidney physiology and developing new treatments for renal tubular disorders.&quot;],&quot;location&quot;:[0,&quot;chrX:42912678-43067849&quot;]}],[0,{&quot;type&quot;:[0,&quot;renal&quot;],&quot;name&quot;:[0,&quot;PKD1/PKD2&quot;],&quot;name2&quot;:[0,&quot;PKD1&quot;],&quot;summary&quot;:[0,&quot;These genes produce proteins that form a complex in kidney cells involved in cell signaling and sensing flow in kidney tubules. Mutations cause polycystic kidney disease in Bull Terriers and humans, a significant cause of kidney failure in both species. Affected dogs develop fluid-filled cysts in their kidneys that gradually replace normal kidney tissue, leading to progressive kidney dysfunction. The canine model has been valuable for understanding disease progression and testing potential treatments for this common genetic cause of kidney failure.&quot;],&quot;location&quot;:[0,&quot;chr6:39267946-39309679&quot;]}],[0,{&quot;type&quot;:[0,&quot;renal&quot;],&quot;name&quot;:[0,&quot;CUBN&quot;],&quot;name2&quot;:[0,&quot;CUBN&quot;],&quot;summary&quot;:[0,&quot;This gene produces cubilin, a protein important for reabsorbing certain nutrients in the kidneys and intestines, particularly vitamin B12. Mutations cause selective cobalamin malabsorption in Border Collies and humans, leading to megaloblastic anemia and neurological issues if untreated. Affected dogs develop failure to thrive, anemia, and neurological abnormalities that respond to B12 supplementation. Research on this gene has illuminated important aspects of vitamin absorption and kidney function across species.&quot;],&quot;location&quot;:[0,&quot;chr2:18734135-18999935&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;POMC&quot;],&quot;name2&quot;:[0,&quot;POMC&quot;],&quot;summary&quot;:[0,&quot;This gene produces hormones involved in appetite regulation. In Labrador Retrievers and Flat-Coated Retrievers, a specific mutation causes increased food motivation, obesity, and higher body weight. This parallels human obesity associated with POMC mutations, where similar mechanisms lead to insatiable appetite. The discovery has practical implications for managing weight in susceptible dog breeds and validates dogs as models for studying obesity genetics.&quot;],&quot;location&quot;:[0,&quot;chr17:19496844-19503629&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;LEP&quot;],&quot;name2&quot;:[0,&quot;LEP&quot;],&quot;summary&quot;:[0,&quot;This gene produces the hormone leptin, which signal the brain about body fat stores to regulate appetite. Variations affect body weight, food motivation, and fat distribution across dog breeds. While complete leptin deficiency is rare in dogs, subtle variations may contribute to differences in metabolism and obesity susceptibility between breeds. These genes have been central to understanding how body weight is regulated.&quot;],&quot;location&quot;:[0,&quot;chr14:7975126-7979538&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;LEPR&quot;],&quot;name2&quot;:[0,&quot;LEPR&quot;],&quot;summary&quot;:[0,&quot;This gene produces a leptin receptor, which signal the brain about body fat stores to regulate appetite. Variations affect body weight, food motivation, and fat distribution across dog breeds. While complete leptin deficiency is rare in dogs, subtle variations may contribute to differences in metabolism and obesity susceptibility between breeds. These genes have been central to understanding how body weight is regulated.&quot;],&quot;location&quot;:[0,&quot;chr5:45029763-45094688&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;MC4R&quot;],&quot;name2&quot;:[0,&quot;MC4R&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor in the brain that helps control energy balance and appetite. Variations are associated with body weight differences and obesity susceptibility across dog breeds. Similar to humans, where MC4R mutations are a common genetic cause of severe obesity, specific canine variants can predispose to increased food intake and weight gain. Research on this gene has contributed to understanding weight regulation in both species.&quot;],&quot;location&quot;:[0,&quot;chr1:16214421-16215419&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;GALNS&quot;],&quot;name2&quot;:[0,&quot;GALNS&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down specific complex carbohydrates. Deficiency causes mucopolysaccharidosis IVA (Morquio A syndrome), a storage disorder where these substances accumulate throughout the body. Affected dogs develop skeletal abnormalities, cloudy corneas, and other problems, similar to human patients. Dog models have been valuable for testing enzyme replacement therapy and other treatment approaches.&quot;],&quot;location&quot;:[0,&quot;chr5:65018205-65046122&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;IDUA&quot;],&quot;name2&quot;:[0,&quot;IDUA&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down certain complex carbohydrates. Deficiency causes mucopolysaccharidosis I, a storage disorder where these substances accumulate in tissues. Affected dogs develop skeletal abnormalities, cloudy corneas, heart valve defects, and sometimes neurological signs. Canine research directly informed treatments now used in human patients, including enzyme replacement therapy and stem cell transplantation.&quot;],&quot;location&quot;:[0,&quot;chr3:92130626-92143201&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;GUSB&quot;],&quot;name2&quot;:[0,&quot;GUSB&quot;],&quot;summary&quot;:[0,&quot;This gene produces beta-glucuronidase, an enzyme that breaks down complex carbohydrates. Deficiency causes mucopolysaccharidosis VII, a storage disorder first described in German Shepherds. Affected dogs develop skeletal abnormalities, cloudy corneas, and often neurological problems. Research in dogs has been crucial for developing treatments including enzyme replacement therapy and gene therapy, which have applications for human patients.&quot;],&quot;location&quot;:[0,&quot;chr6:644508-657770&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;G6PC&quot;],&quot;name2&quot;:[0,&quot;G6PC&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that converts glucose-6-phosphate to glucose, allowing the liver to release glucose into the bloodstream. Mutations cause glycogen storage disease type Ia, a disorder where affected dogs develop low blood sugar, growth issues, and liver enlargement. The condition closely resembles human GSD Ia. Research in dogs has been valuable for testing gene therapy approaches, which have shown promising results in both species.&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;PAH&quot;],&quot;name2&quot;:[0,&quot;PAH&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that converts the amino acid phenylalanine to tyrosine. Mutations cause phenylketonuria or related conditions where phenylalanine levels become elevated. If untreated, these can lead to brain damage and developmental problems. While relatively rare in dogs compared to humans, the underlying mechanisms are similar. Research on this gene has contributed to understanding these disorders and developing potential treatments.&quot;],&quot;location&quot;:[0,&quot;chr15:41882259-41962824&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;SGSH&quot;],&quot;name2&quot;:[0,&quot;SGSH&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that breaks down heparan sulfate, a complex carbohydrate. Deficiency causes mucopolysaccharidosis IIIA (Sanfilippo syndrome type A), a storage disorder affecting primarily the brain. This condition has been documented in Dachshunds and New Zealand Huntaways. Affected dogs develop progressive neurological deterioration, behavioral changes, and cognitive decline. Dog models have been crucial for testing potential treatments including enzyme replacement and gene therapy.&quot;],&quot;location&quot;:[0,&quot;chr9:2403348-2409505&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;HEXB&quot;],&quot;name2&quot;:[0,&quot;HEXB&quot;],&quot;summary&quot;:[0,&quot;This gene produces part of an enzyme that breaks down certain fats in neurons. Deficiency causes Sandhoff disease, a rare disorder where these fats accumulate primarily in nerve cells. Affected dogs develop progressive neurological problems including coordination difficulties and tremors. Research on this condition in dogs has provided insights into disease mechanisms and potential treatments that might benefit both species.&quot;],&quot;location&quot;:[0,&quot;chr2:56470393-56499556&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;FUCA1&quot;],&quot;name2&quot;:[0,&quot;FUCA1&quot;],&quot;summary&quot;:[0,&quot;This gene produces alpha-L-fucosidase, an enzyme that breaks down specific complex sugars attached to proteins and fats. Deficiency causes fucosidosis, a rare storage disorder documented in English Springer Spaniels. Affected dogs develop progressive neurological signs, including behavioral changes and loss of learned behaviors. Canine research has been valuable for understanding the neurological aspects of the disease and testing treatments like bone marrow transplantation.&quot;],&quot;location&quot;:[0,&quot;chr2:75059639-75071248&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;GNPTAB&quot;],&quot;name2&quot;:[0,&quot;GNPTAB&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that adds a targeting tag to lysosomal enzymes, ensuring they reach their correct location in the cell. Mutations cause mucolipidosis II/III, rare disorders where multiple lysosomal enzymes are misrouted. Affected dogs develop skeletal abnormalities, growth issues, and various organ problems. The similarities to human mucolipidosis make affected dogs valuable models for understanding these complex disorders.&quot;],&quot;location&quot;:[0,&quot;chr15:40950892-41016624&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;SLC3A1&quot;],&quot;name2&quot;:[0,&quot;SLC3A1&quot;],&quot;summary&quot;:[0,&quot;This gene produces one part of a transporter that reabsorbs the amino acid cystine in the kidneys. Mutations cause type A cystinuria, a condition where excessive cystine in the urine leads to stone formation. Affected dogs may develop painful urinary blockages and kidney damage due to recurring stone formation. This form of cystinuria is particularly common in Newfoundlands and Landseers. The disease has a simple autosomal recessive inheritance pattern, meaning both parents must carry the mutation for puppies to be affected. Genetic testing allows breeders to identify carriers and avoid producing affected dogs. Similar mutations cause cystinuria in humans, making this a valuable model for comparative medicine.&quot;],&quot;location&quot;:[0,&quot;chr10:47760850-47796315&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;SLC7A9&quot;],&quot;name2&quot;:[0,&quot;SLC7A9&quot;],&quot;summary&quot;:[0,&quot;This gene produces the second part of a transporter complex that reabsorbs the amino acid cystine in the kidneys. Mutations cause type B cystinuria, where excessive cystine in the urine leads to stone formation. This form is common in multiple breeds including Miniature Pinschers, Australian Cattle Dogs, and Labrador Retrievers. Unlike type A, it shows more variable inheritance patterns and can sometimes affect heterozygous carriers (dogs with only one mutated copy). Affected dogs typically develop symptoms later than in type A cystinuria. Male dogs are more frequently diagnosed due to their anatomy making them more prone to urethral blockages. Genetic testing helps identify at-risk dogs and inform breeding decisions.&quot;],&quot;location&quot;:[0,&quot;chr1:120050385-120073608&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;IGF1&quot;],&quot;name2&quot;:[0,&quot;IGF1&quot;],&quot;summary&quot;:[0,&quot;This gene produces insulin-like growth factor 1, a hormone crucial for growth and development. A specific variant is one of the main genetic factors determining small body size in dogs. This small-size variant is found almost exclusively in small breeds and was likely one of the first genes selected during early dog domestication. Research on this gene has provided valuable insights into size variation and the genetics of dog domestication.&quot;],&quot;location&quot;:[0,&quot;chr15:41495479-41567874&quot;]}],[0,{&quot;type&quot;:[0,&quot;metabolic&quot;],&quot;name&quot;:[0,&quot;CFTR&quot;],&quot;name2&quot;:[0,&quot;CFTR&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that forms a channel for chloride ions, important for creating proper mucus consistency in the lungs and digestive system. Mutations cause cystic fibrosis in humans, a life-threatening condition affecting multiple organ systems. Dogs with CFTR mutations develop similar but milder respiratory and digestive issues, making them valuable for testing potential therapies. Research in dogs has contributed to the development of treatments that are now being tested in human patients with cystic fibrosis.&quot;],&quot;location&quot;:[0,&quot;chr14:56421094-56583513&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;MYBPC3&quot;],&quot;name2&quot;:[0,&quot;MYBPC3&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein found in heart muscle that helps regulate contraction. Mutations can cause hypertrophic cardiomyopathy, a condition where the heart muscle thickens abnormally. Affected animals develop thickened heart walls, which can lead to heart failure, abnormal rhythms, and sudden death. Similar mutations cause the same condition in humans, making this an important gene for comparative cardiac research.&quot;],&quot;location&quot;:[0,&quot;chr18:42697140-42713582&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;MYH7&quot;],&quot;name2&quot;:[0,&quot;MYH7&quot;],&quot;summary&quot;:[0,&quot;This gene produces a major protein in heart muscle essential for contraction. Mutations can cause dilated cardiomyopathy, a condition where the heart becomes enlarged and cannot pump efficiently. This condition is common in large breeds, including Great Danes. Affected dogs develop heart enlargement and weakness, leading to congestive heart failure. Research on this gene has improved our understanding of genetic factors in heart disease.&quot;],&quot;location&quot;:[0,&quot;chr8:3782913-3802783&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;PKP2&quot;],&quot;name2&quot;:[0,&quot;PKP2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein found in desmosomes, structures that connect heart muscle cells together. Mutations can cause arrhythmogenic right ventricular cardiomyopathy (ARVC), particularly in Boxers. This condition causes replacement of heart muscle with fibrous and fatty tissue, leading to electrical abnormalities and potential sudden death. Like humans with PKP2 mutations, affected dogs are at risk for dangerous heart rhythms.&quot;],&quot;location&quot;:[0,&quot;chr27:30463876-30551090&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;LMNA&quot;],&quot;name2&quot;:[0,&quot;LMNA&quot;],&quot;summary&quot;:[0,&quot;This gene produces proteins that provide structure to the cell nucleus. Mutations can cause dilated cardiomyopathy, particularly in breeds like Irish Wolfhounds. Similar to humans with LMNA mutations, affected dogs often develop electrical conduction problems before heart muscle weakness appears. Research on this gene has improved our understanding of how nuclear proteins affect heart function.&quot;],&quot;location&quot;:[0,&quot;chr7:41687512-41704901&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;DSG2&quot;],&quot;name2&quot;:[0,&quot;DSG2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein component of desmosomes, structures that connect heart muscle cells together. Mutations can cause arrhythmogenic right ventricular cardiomyopathy (ARVC), particularly in Boxers. Affected dogs develop fibrous and fatty tissue replacing normal heart muscle, leading to dangerous heart rhythms and potential sudden death. The similarities to human ARVC make this condition important for comparative research.&quot;],&quot;location&quot;:[0,&quot;chr7:57958817-58007069&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;KCNQ1&quot;],&quot;name2&quot;:[0,&quot;KCNQ1&quot;],&quot;summary&quot;:[0,&quot;This gene produces a potassium channel in heart cells that helps the heart return to its resting state after each contraction. Mutations can cause long QT syndrome, an electrical disorder that can lead to dangerous heart rhythms and sudden death. Similar to humans with the same condition, affected dogs show prolonged recovery periods on electrocardiograms and are at risk for fainting and collapse, particularly during exercise or excitement.&quot;],&quot;location&quot;:[0,&quot;chr18:46962029-47285048&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;KCNH2&quot;],&quot;name2&quot;:[0,&quot;KCNH2&quot;],&quot;summary&quot;:[0,&quot;This gene, like KCNQ1, produces a different potassium channel in heart cells that helps the heart return to its resting state after contraction. Mutations can also cause long QT syndrome. Dogs with KCNH2 mutations typically show abnormal heart rhythms in response to stress or excitement. Studying these mutations in dogs has helped improve our understanding of heart rhythm disorders and potential treatments.&quot;],&quot;location&quot;:[0,&quot;chr16:15735820-15768605&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;SCN5A&quot;],&quot;name2&quot;:[0,&quot;SCN5A&quot;],&quot;summary&quot;:[0,&quot;This gene produces a sodium channel that helps generate the electrical impulses in heart muscle. Mutations can cause various heart rhythm disorders, including long QT syndrome and irregular heartbeats. Affected dogs can develop conduction disturbances, dangerous heart rhythms, and are at risk for sudden death. Research on this gene has contributed to our understanding of cardiac electrical activity and the development of targeted treatments.&quot;],&quot;location&quot;:[0,&quot;chr23:8517525-8595709&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;ACTN2&quot;],&quot;name2&quot;:[0,&quot;ACTN2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that anchors structural components within heart muscle cells. Mutations can cause hypertrophic cardiomyopathy, a condition where the heart walls thicken abnormally. Affected dogs develop increased heart wall thickness, which can obstruct blood flow, cause heart failure, and lead to abnormal rhythms. Identifying mutations in this gene helps with early detection and breeding programs.&quot;],&quot;location&quot;:[0,&quot;chr4:3719762-3786237&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;STRN&quot;],&quot;name2&quot;:[0,&quot;STRN&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein involved in cell signaling in heart muscle cells. In Boxers, a specific deletion in this gene is strongly associated with arrhythmogenic right ventricular cardiomyopathy, often called \&quot;Boxer cardiomyopathy.\&quot; This condition causes dangerous heart rhythms and potential sudden death. The discovery of this mutation led to a genetic test for early identification of at-risk dogs, potentially saving lives through appropriate management.&quot;],&quot;location&quot;:[0,&quot;chr17:29427442-29523408&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;PDK4&quot;],&quot;name2&quot;:[0,&quot;PDK4&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that regulates energy metabolism in the heart. In Doberman Pinschers, mutations in this gene are strongly associated with dilated cardiomyopathy, where the heart becomes enlarged and weakened. The gene affects how the heart produces and uses energy, potentially leading to energy deficits in heart muscle. A genetic test for this mutation helps identify at-risk Dobermans before they show symptoms.&quot;],&quot;location&quot;:[0,&quot;chr14:20785483-20798897&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;TTN&quot;],&quot;name2&quot;:[0,&quot;TTN&quot;],&quot;summary&quot;:[0,&quot;This gene produces titin, the largest known protein, which functions as a molecular spring in heart muscle. Mutations can cause dilated cardiomyopathy in large breeds like Irish Wolfhounds and Great Danes. The enormous size of this gene makes it challenging to study, but advances in genetic technology have revealed its importance in heart health. Affected dogs develop progressive heart enlargement and weakness, leading to heart failure.&quot;],&quot;location&quot;:[0,&quot;chr36:22479043-22752940&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;RYR2&quot;],&quot;name2&quot;:[0,&quot;RYR2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a calcium channel in heart muscle cells that helps control muscle contraction. Variations can cause certain heart rhythm disorders, particularly those triggered by exercise or stress. Similar to humans with RYR2 mutations, affected dogs can develop dangerous heart rhythms during physical activity or excitement. Research on this gene has improved our understanding of how calcium handling affects heart rhythms.&quot;],&quot;location&quot;:[0,&quot;chr4:2743722-3470663&quot;]}],[0,{&quot;type&quot;:[0,&quot;cardiovascular&quot;],&quot;name&quot;:[0,&quot;ACVRL1&quot;],&quot;name2&quot;:[0,&quot;ACVRL1&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor involved in blood vessel development and function. Variations can cause vascular malformations and abnormalities in dogs, similar to a human condition called hereditary hemorrhagic telangiectasia. These abnormalities can affect blood vessels in the skin, mucous membranes, and internal organs, potentially leading to bleeding. Research on this gene has improved our understanding of blood vessel formation and maintenance.&quot;],&quot;location&quot;:[0,&quot;chr27:43565141-43579587&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;ITGB2&quot;],&quot;name2&quot;:[0,&quot;ITGB2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein essential for immune cell function, helping white blood cells stick to blood vessel walls and move to sites of infection. In Irish Setters, mutations cause canine leukocyte adhesion deficiency (CLAD), a severe immunodeficiency where neutrophils cannot reach infection sites. Affected puppies typically develop life-threatening infections early in life. Genetic testing has greatly reduced this condition in the breed.&quot;],&quot;location&quot;:[0,&quot;chr31:38463168-38490402&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;IL1RN&quot;],&quot;name2&quot;:[0,&quot;IL1RN&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that helps control inflammation by blocking the effects of a pro-inflammatory molecule called interleukin-1. Variations affect how strongly dog
