s respond to inflammatory triggers and their susceptibility to inflammatory diseases. The IL-1 system acts like a thermostat for inflammation, and alterations in this balance can influence disease development. Research on this gene has provided insights into controlling excessive inflammation.&quot;],&quot;location&quot;:[0,&quot;chr17:37426795-37431843&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;IL6&quot;],&quot;name2&quot;:[0,&quot;IL6&quot;],&quot;summary&quot;:[0,&quot;This gene produces a cytokine (signaling molecule) that functions in inflammation and immune cell development. Variations affect inflammatory responses and susceptibility to various inflammatory and immune-mediated diseases in dogs. IL6 helps coordinate the acute phase response to infection or injury and influences the transition from innate to adaptive immunity. This gene is a key target for anti-inflammatory therapies in both veterinary and human medicine.&quot;],&quot;location&quot;:[0,&quot;chr14:36553276-36557530&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;IL10&quot;],&quot;name2&quot;:[0,&quot;IL10&quot;],&quot;summary&quot;:[0,&quot;This gene produces an anti-inflammatory cytokine that helps regulate immune responses and prevent excessive inflammation. Variations affect immune regulation and susceptibility to conditions like inflammatory bowel disease and skin allergies in dogs. IL10 works by dampening inflammatory responses and preventing overreaction to triggers. Research on this gene helps explain why some dogs are more prone to inflammatory conditions than others.&quot;],&quot;location&quot;:[0,&quot;chr7:5697728-5701500&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;TNF&quot;],&quot;name2&quot;:[0,&quot;TNF&quot;],&quot;summary&quot;:[0,&quot;This gene produces tumor necrosis factor, a powerful inflammatory cytokine involved in immune regulation, inflammation, and cell death. Variations affect inflammatory responses and susceptibility to various immune-mediated diseases in dogs. TNF plays important roles in both fighting infections and contributing to inflammatory diseases. In human medicine, blocking TNF is a major therapeutic strategy for conditions like rheumatoid arthritis and inflammatory bowel disease.&quot;],&quot;location&quot;:[0,&quot;chr12:1213251-1215120&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;TLR4&quot;],&quot;name2&quot;:[0,&quot;TLR4&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor that recognizes components of bacterial cell walls, particularly from gram-negative bacteria. Variations affect immune responses to bacterial infections and susceptibility to conditions like sepsis and inflammatory disorders. TLR4 acts as a sentinel, detecting bacterial presence and initiating immune responses. Research on this gene has improved our understanding of how dogs recognize and respond to bacterial infections.&quot;],&quot;location&quot;:[0,&quot;chr11:71767611-71778394&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;PTPN22&quot;],&quot;name2&quot;:[0,&quot;PTPN22&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme that helps regulate T-cell activation, an important part of the immune response. Variations are associated with susceptibility to autoimmune diseases in dogs, including diabetes and immune-mediated anemia. PTPN22 helps maintain the balance between effective immune responses and self-tolerance. Research on this gene has provided insights into why some dogs develop autoimmune conditions.&quot;],&quot;location&quot;:[0,&quot;chr17:52148984-52209317&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;C3&quot;],&quot;name2&quot;:[0,&quot;C3&quot;],&quot;summary&quot;:[0,&quot;This gene produces complement component 3, a central protein in the complement system that enhances antibody responses and promotes inflammation. Mutations can cause complement deficiency, increasing susceptibility to bacterial infections and immune-complex diseases. C3 helps mark pathogens for destruction, recruit inflammatory cells, and clear immune complexes. Dogs with C3 deficiency typically experience recurrent infections, particularly with encapsulated bacteria.&quot;],&quot;location&quot;:[0,&quot;chr20:53965350-53997908&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;CTLA4&quot;],&quot;name2&quot;:[0,&quot;CTLA4&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that helps regulate immune responses by putting the brakes on T-cell activation. Variations are associated with susceptibility to autoimmune diseases in dogs, including Addison&#39;s disease and immune-mediated anemia. CTLA4 provides an essential checkpoint to prevent excessive immune responses that might target self-tissues. Drugs targeting this pathway are used in human medicine to treat autoimmune diseases and cancer.&quot;],&quot;location&quot;:[0,&quot;chr37:12505745-12511890&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;IFNG&quot;],&quot;name2&quot;:[0,&quot;IFNG&quot;],&quot;summary&quot;:[0,&quot;This gene produces interferon gamma, a cytokine that plays crucial roles in fighting viral and bacterial infections and controlling tumors. Variations affect immune responses to various pathogens and susceptibility to certain infectious diseases in dogs. IFNG helps activate macrophages, enhance antigen presentation, and promote specific types of immune responses. Research on this gene has improved our understanding of how dogs fight different types of infections.&quot;],&quot;location&quot;:[0,&quot;chr10:10768058-10772882&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;FAS/FASLG&quot;],&quot;name2&quot;:[0,&quot;FAS&quot;],&quot;summary&quot;:[0,&quot;These genes produce a receptor and its binding partner that trigger programmed cell death, which is important for removing potentially harmful cells. Variations can lead to immune dysregulation and certain blood cell disorders in dogs. The FAS/FASLG system helps maintain the proper balance of lymphocytes after an immune response and mediates the killing of infected or damaged cells. Problems with this system can lead to autoimmunity and lymph node enlargement.&quot;],&quot;location&quot;:[0,&quot;chr26:39027502-39052301&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;MHC/DLA&quot;],&quot;name2&quot;:[0,&quot;MHC&quot;],&quot;summary&quot;:[0,&quot;These genes, known as the Dog Leukocyte Antigen (DLA) system, produce proteins essential for immune recognition and regulation. Specific variants are associated with susceptibility to various immune-mediated diseases, including diabetes, thyroid disease, and inflammatory bowel disease. This highly variable gene complex helps determine how dogs respond to infections, vaccines, and their own tissues. Research on these genes helps explain breed differences in disease susceptibility.&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;PSMB8&quot;],&quot;name2&quot;:[0,&quot;PSMB8&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of the immunoproteasome, a cellular structure that generates peptides for immune recognition. Mutations can cause certain autoinflammatory syndromes characterized by fever, skin lesions, and joint inflammation. The immunoproteasome plays crucial roles in protein degradation, antigen processing, and stress responses. Research on this gene has revealed connections between protein processing and inflammation.&quot;],&quot;location&quot;:[0,&quot;chr12:2574324-2577715&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;RAG1/2&quot;],&quot;name2&quot;:[0,&quot;RAG1&quot;],&quot;summary&quot;:[0,&quot;These genes produce enzymes essential for creating the diverse repertoire of antibodies and T-cell receptors needed for immune protection. Mutations cause severe combined immunodeficiency (SCID), where both antibody and cellular immunity are profoundly impaired. Affected puppies typically develop severe infections early in life due to the absence of functional B and T cells. These genes have been important targets for gene therapy approaches.&quot;],&quot;location&quot;:[0,&quot;chr18:32033403-32036534&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;IL2RA&quot;],&quot;name2&quot;:[0,&quot;IL2RA&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of the receptor for interleukin-2, a cytokine important for T-cell growth and regulatory T-cell function. Variations affect immune regulation and susceptibility to certain immune-mediated diseases in dogs. The IL-2 receptor is essential for both promoting immune responses and maintaining self-tolerance through regulatory T cells. Research on this gene helps explain the balance between effective immunity and autoimmunity.&quot;],&quot;location&quot;:[0,&quot;chr2:28928272-28977130&quot;]}],[0,{&quot;type&quot;:[0,&quot;immunological&quot;],&quot;name&quot;:[0,&quot;CYBB&quot;],&quot;name2&quot;:[0,&quot;CYBB&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of an enzyme complex that generates reactive oxygen species used by immune cells to kill bacteria. Mutations cause chronic granulomatous disease in both dogs and humans, a rare immune disorder characterized by recurrent bacterial and fungal infections. Affected dogs develop persistent infections that don&#39;t respond well to standard treatments, as their neutrophils cannot effectively kill certain types of bacteria. Research on this gene has improved our understanding of how the immune system combats specific types of infections.&quot;],&quot;location&quot;:[0,&quot;chrX:32671823-32706767&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;BRCA1/2&quot;],&quot;name2&quot;:[0,&quot;BRCA1&quot;],&quot;summary&quot;:[0,&quot;These genes help repair damaged DNA and prevent cancer. Mutations increase the risk of mammary tumors in female dogs, similar to how they increase breast cancer risk in humans. These genes are important for research on both canine and human cancers, and studies in dogs have provided valuable insights for human cancer research. In both species, mutations significantly increase cancer risk.&quot;],&quot;location&quot;:[0,&quot;chr9:19833116-19896786&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;TP53&quot;],&quot;name2&quot;:[0,&quot;TP53&quot;],&quot;summary&quot;:[0,&quot;Often called the \&quot;guardian of the genome,\&quot; this gene helps prevent cancer by identifying damaged DNA and either repairing it or triggering cell death if the damage is too severe. Mutations in TP53 are linked to various cancers in dogs, including bone cancer, lymphoma, and mammary tumors. The gene functions similarly in humans and dogs, making canine cancer studies relevant to human medicine.&quot;],&quot;location&quot;:[0,&quot;chr5:32768467-32781775&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;MYC&quot;],&quot;name2&quot;:[0,&quot;MYC&quot;],&quot;summary&quot;:[0,&quot;This gene helps regulate cell growth and division. When abnormally activated, it can drive uncontrolled cell growth leading to cancer. In dogs, MYC is particularly associated with lymphoma, one of the most common canine cancers. Studying how MYC functions in canine lymphoma has provided insights for treating similar cancers in both dogs and humans.&quot;],&quot;location&quot;:[0,&quot;chr13:25629077-25633621&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;PTEN&quot;],&quot;name2&quot;:[0,&quot;PTEN&quot;],&quot;summary&quot;:[0,&quot;This gene acts as a tumor suppressor by limiting cell division and growth. Mutations or decreased function can lead to various cancers in dogs, particularly melanoma and hemangiosarcoma. PTEN works by inhibiting a key pathway that promotes cell growth, and when it&#39;s not working properly, cells can grow out of control. The gene functions similarly in humans and dogs.&quot;],&quot;location&quot;:[0,&quot;chr26:38118261-38202372&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;KIT&quot;],&quot;name2&quot;:[0,&quot;KIT&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor that helps control cell growth and division. Mutations that cause the receptor to be constantly active lead to mast cell tumors, one of the most common skin tumors in dogs. Understanding KIT mutations in dogs has led to the development of targeted treatments that work for both canine and human cancers with similar mutations.&quot;],&quot;location&quot;:[0,&quot;chr13:47870472-47952050&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;BRAF&quot;],&quot;name2&quot;:[0,&quot;BRAF&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that relays signals telling cells to grow. Mutations can cause the signaling to be stuck in the \&quot;on\&quot; position, leading to uncontrolled cell growth. In dogs, BRAF mutations are found in bladder cancer and melanoma. Research on these mutations has led to targeted therapies that benefit both species.&quot;],&quot;location&quot;:[0,&quot;chr16:7929505-8101841&quot;],&quot;citations&quot;:[0,&quot;(Appenzeller et al., 2025)&quot;],&quot;doi1&quot;:[0,&quot;https://doi.org/10.3390/vetsci12080729&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;MDM2&quot;],&quot;name2&quot;:[0,&quot;MDM2&quot;],&quot;summary&quot;:[0,&quot;This gene regulates p53, a key tumor suppressor. When MDM2 is overactive, it reduces p53 function, allowing damaged cells to survive and potentially become cancerous. In dogs, MDM2 is often amplified in bone cancers (osteosarcoma). Dog osteosarcoma is very similar to the human disease, making it an excellent model for research.&quot;],&quot;location&quot;:[0,&quot;chr10:11296600-11322142&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;CDKN2A/B&quot;],&quot;name2&quot;:[0,&quot;CDKN2A&quot;],&quot;summary&quot;:[0,&quot;These genes act as brakes on cell division, preventing cells from dividing too rapidly. When deleted or not functioning properly, they contribute to various cancers in dogs, including melanoma, bone cancer, and lymphoma. The pattern of CDKN2A/B alterations in canine cancers often mirrors what&#39;s seen in human cancers.&quot;],&quot;location&quot;:[0,&quot;chr11:41337054-41366301&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;RB1&quot;],&quot;name2&quot;:[0,&quot;RB1&quot;],&quot;summary&quot;:[0,&quot;Named after retinoblastoma in humans, this gene prevents cells from dividing uncontrollably. Mutations are associated with various cancers in dogs, particularly osteosarcoma (bone cancer), which is common in large breeds. Canine osteosarcoma shares many features with the human disease, making it valuable for comparative cancer research.&quot;],&quot;location&quot;:[0,&quot;chr22:3028586-3174226&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;HER2/ERBB2&quot;],&quot;name2&quot;:[0,&quot;HER2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor that, when overexpressed, drives aggressive cancer growth. In dogs, HER2 amplification is observed in aggressive mammary tumors, similar to HER2-positive breast cancer in humans. Dogs with HER2-positive tumors typically have a worse prognosis. Research on this gene has led to targeted therapies for both species.&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;NRAS&quot;],&quot;name2&quot;:[0,&quot;NRAS&quot;],&quot;summary&quot;:[0,&quot;This gene helps control cell growth and division. Mutations can lock it in an active state, leading to uncontrolled cell growth. In dogs, NRAS mutations are found particularly in melanoma, an aggressive cancer in certain breeds. The molecular features of canine melanoma with NRAS mutations are similar to human melanomas, making dogs useful for comparative studies.&quot;],&quot;location&quot;:[0,&quot;chr17:52938741-52945813&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;BCL2&quot;],&quot;name2&quot;:[0,&quot;BCL2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that prevents cell death, which is normally important for tissue maintenance. However, when BCL2 is overexpressed in cancer cells, it helps them survive when they should die. In dogs, BCL2 overexpression is associated with lymphoma, particularly B-cell lymphoma. Research has led to treatments targeting BCL2 for both dogs and humans.&quot;],&quot;location&quot;:[0,&quot;chr1:13811587-13978482&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;VEGF&quot;],&quot;name2&quot;:[0,&quot;VEGF&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein that stimulates the formation of new blood vessels, which is necessary for wound healing but also allows tumors to grow beyond a certain size. In dogs, increased VEGF is seen in various cancers, especially hemangiosarcoma, a highly vascular tumor affecting the spleen. Treatments targeting VEGF have been developed for both canine and human cancers.&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;COX2&quot;],&quot;name2&quot;:[0,&quot;COX2&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme involved in inflammation and cell growth. Overexpression is seen in various canine cancers, particularly bladder cancer. COX2 promotes tumor growth through multiple mechanisms, including stimulating blood vessel formation and inhibiting cell death. COX2 inhibitors have been developed as potential cancer treatments for both dogs and humans.&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;MET&quot;],&quot;name2&quot;:[0,&quot;MET&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor that, when activated, promotes cell growth, survival, and movement. Abnormal activation can drive cancer growth and spread. In dogs, MET alterations are found in various cancers, particularly osteosarcoma. Canine osteosarcoma shares many features with human osteosarcoma, making it valuable for testing new treatments targeting MET.&quot;],&quot;location&quot;:[0,&quot;chr14:55755770-55839237&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;HMGA1/2&quot;],&quot;name2&quot;:[0,&quot;HMGA1&quot;],&quot;summary&quot;:[0,&quot;These genes produce proteins that alter DNA structure and affect gene expression. Overexpression is associated with various benign tumors in dogs, particularly fatty tumors (lipomas). Rearrangements of these genes are especially common in canine lipomas, providing a valuable model for studying these generally benign but sometimes problematic tumors. Research on these genes has improved our understanding of both benign and malignant tumor development.&quot;],&quot;location&quot;:[0,&quot;chr12:3707513-3716880&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;PTPN11&quot;],&quot;name2&quot;:[0,&quot;PTPN11&quot;],&quot;summary&quot;:[0,&quot;This gene produces an enzyme involved in cell signaling pathways that regulate growth and metabolism. Mutations can lead to constant activation of the protein, resulting in uncontrolled cell growth in certain canine mast cell tumors. In humans, mutations in this gene cause Noonan syndrome and are found in various leukemias. Research on this gene has identified potential targets for treating both dog and human cancers with similar molecular changes.&quot;],&quot;location&quot;:[0,&quot;chr26:10314568-10397234&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;ERBB3&quot;],&quot;name2&quot;:[0,&quot;ERBB3&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor that, when activated, promotes cell growth and survival. Alterations are associated with various dog cancers, including mammary tumors and oral melanomas. The receptor typically works together with other related receptors, particularly HER2/ERBB2. Research on this gene family has led to the development of targeted therapies for both veterinary and human cancers, especially breast cancer in humans.&quot;],&quot;location&quot;:[0,&quot;chr10:758352-776205&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;PIK3CA&quot;],&quot;name2&quot;:[0,&quot;PIK3CA&quot;],&quot;summary&quot;:[0,&quot;This gene produces a component of an enzyme involved in cell growth signaling pathways. Mutations typically cause constant activation of these pathways, promoting cancer development. In dogs, mutations are found in various cancers, including mammary tumors and hemangiosarcoma. This gene is one of the most frequently mutated genes in human cancers as well, making it an important target for cancer drug development.&quot;],&quot;location&quot;:[0,&quot;chr34:12771120-12850124&quot;]}],[0,{&quot;type&quot;:[0,&quot;cancer&quot;],&quot;name&quot;:[0,&quot;CCND1&quot;],&quot;name2&quot;:[0,&quot;CCND1&quot;],&quot;summary&quot;:[0,&quot;This gene produces cyclin D1, a protein that helps control cell division. Overexpression or amplification drives excessive cell proliferation in various canine cancers, including mammary tumors and lymphomas. Similar mechanisms operate in human cancers, including breast cancer. Research on this gene has led to the development of drugs targeting the cyclin D-CDK4/6 complex for both veterinary and human patients.&quot;],&quot;location&quot;:[0,&quot;chr18:48958012-48967584&quot;]}],[0,{&quot;type&quot;:[0,&quot;developmental&quot;],&quot;name&quot;:[0,&quot;SMOC2&quot;],&quot;name2&quot;:[0,&quot;SMOC2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a protein involved in cell-matrix interactions and signaling during development. A mutation is associated with brachycephaly (shortened skull) in breeds like Bulldogs, Pugs, and Boxers. The gene influences how bones and cartilage form in the skull during development. Research on this gene has helped explain the genetics behind these distinctive breed characteristics and the associated health challenges.&quot;],&quot;location&quot;:[0,&quot;chr1:56380993-56539474&quot;]}],[0,{&quot;type&quot;:[0,&quot;behavioral&quot;],&quot;name&quot;:[0,&quot;OXTR&quot;],&quot;name2&quot;:[0,&quot;OXTR&quot;],&quot;summary&quot;:[0,&quot;This gene produces the receptor for oxytocin, a hormone involved in social bonding and trust. Variations are associated with differences in social behavior in dogs, particularly in how they interact with humans. Dogs with certain variants may be more likely to seek human attention and respond to social cues. Research on this gene has helped explain the biological basis of the human-dog bond and dog domestication.&quot;],&quot;location&quot;:[0,&quot;chr20:9429314-9449013&quot;]}],[0,{&quot;type&quot;:[0,&quot;behavioral&quot;],&quot;name&quot;:[0,&quot;DRD4&quot;],&quot;name2&quot;:[0,&quot;DRD4&quot;],&quot;summary&quot;:[0,&quot;This gene produces a receptor for dopamine, a neurotransmitter involved in reward, motivation, and impulse control. Length variations are associated with differences in activity, impulsivity, and novelty-seeking behaviors in dogs. Dogs with specific variants may show higher levels of activity, greater distractibility, or more intense behaviors. Research on this gene has provided insights into the genetic basis of temperament differences across breeds.&quot;],&quot;location&quot;:[0,&quot;chr18:26081003-26083706&quot;]}],[0,{&quot;type&quot;:[0,&quot;behavioral&quot;],&quot;name&quot;:[0,&quot;TH&quot;],&quot;name2&quot;:[0,&quot;TH&quot;],&quot;summary&quot;:[0,&quot;This gene produces tyrosine hydroxylase, an enzyme that helps make dopamine and related neurotransmitters. Variations are associated with differences in activity levels, stress responses, and certain behavioral traits in dogs. The gene directly influences the availability of key brain chemicals affecting arousal, attention, and stress reactivity. Research on this gene has improved our understanding of the neurochemical basis of behavior.&quot;],&quot;location&quot;:[0,&quot;chr18:46782129-46789967&quot;]}],[0,{&quot;type&quot;:[0,&quot;behavioral&quot;],&quot;name&quot;:[0,&quot;SLC1A2&quot;],&quot;name2&quot;:[0,&quot;SLC1A2&quot;],&quot;summary&quot;:[0,&quot;This gene produces a transporter that removes the excitatory neurotransmitter glutamate from synapses, preventing excessive stimulation. Variations are associated with differences in cognitive abilities, stress resistance, and potentially certain neurological and behavioral disorders in dogs. Proper glutamate clearance is critical for normal brain function. Research on this gene has provided insights into the genetic basis of cognitive and behavioral traits in dogs.&quot;],&quot;location&quot;:[0,&quot;chr18:32967648-33106043&quot;]}],[0,{&quot;type&quot;:[0,&quot;hypersocial&quot;],&quot;name&quot;:[0,&quot;General transcription factor II-I (GTF2I)&quot;],&quot;name2&quot;:[0,&quot;GTF2I&quot;],&quot;summary&quot;:[0,&quot;This gene plays a role in how dogs interact socially, particularly with humans. Variations are linked to the hypersocial behavior that distinguishes dogs from wolves - their tendency to seek human attention and interaction. Studies show domestic dogs typically have variants that contribute to their friendliness toward humans. This gene helps explain the unique bond between dogs and people and gives insight into the domestication process.&quot;],&quot;location&quot;:[0,&quot;chr6:5644547-5758859&quot;]}],[0,{&quot;type&quot;:[0,&quot;hypersocial&quot;],&quot;name&quot;:[0,&quot;General transcription factor II-I repeat domain-containing protein 1 (GTF2IRD1)&quot;],&quot;name2&quot;:[0,&quot;GTF2IRD1&quot;],&quot;summary&quot;:[0,&quot;Similar to GTF2I, this gene affects social behavior in dogs. It influences how dogs interact with humans and potentially contributed to behavioral changes during domestication. The gene regulates other genes involved in brain development and function, affecting social traits that made dogs suitable companions for humans. Research on this gene helps explain the genetic basis of the human-dog bond.&quot;],&quot;location&quot;:[0,&quot;chr6:5806109-5917143&quot;]}],[0,{&quot;type&quot;:[0,&quot;hypersocial&quot;],&quot;name&quot;:[0,&quot;Putative polypeptide N-acetylgalactosaminyltransferase-like protein 3 (WBSCR17)&quot;],&quot;name2&quot;:[0,&quot;WBSCR17&quot;],&quot;summary&quot;:[0,&quot;This gene is thought to influence social behavior and cognitive abilities in dogs. While its exact function is still being studied, variations are associated with differences in social and cognitive traits across dog breeds. The gene modifies proteins that affect brain development and function. Studying this gene helps scientists understand the genetic basis of dog behavior and the cognitive abilities that developed during domestication.&quot;]}],[0,{&quot;type&quot;:[0,&quot;hypersocial&quot;],&quot;name&quot;:[0,&quot;Nuclear envelope pore membrane protein (POM121)&quot;],&quot;name2&quot;:[0,&quot;POM121&quot;],&quot;summary&quot;:[0,&quot;This gene creates proteins that form pores in the membrane surrounding a cell&#39;s nucleus, allowing molecules to move between the nucleus and the rest of the cell. While less studied than other social behavior genes, it may influence cellular processes that affect development, growth, and various body functions. Some research suggests it could play a role in cellular stress responses and longevity.&quot;]}]]],&quot;chromosomes&quot;:[1,[[0,{&
